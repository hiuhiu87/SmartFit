services:
  postgres:
    image: postgres:16-alpine
    container_name: smartfit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartfit}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartfit}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - smartfit-postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfit-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smartfit}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      RUN_SEED: ${RUN_SEED:-1}
    ports:
      - "${APP_PORT:-8000}:8000"
    command:
      - sh
      - -c
      - |
        if [ "${RUN_MIGRATIONS}" = "1" ]; then
          if find alembic/versions -type f -name "*.py" ! -name "__init__.py" | grep -q .; then
            alembic upgrade head
          else
            echo "No Alembic revision files found. Bootstrapping schema with SQLModel metadata."
            python -m src.infrastructure.database.bootstrap
          fi
        else
          echo "Skipping migrations in compose mode"
        fi
        if [ "${RUN_SEED}" = "1" ]; then
          python -m src.infrastructure.seed.seed_exercises
        else
          echo "Skipping seed in compose mode"
        fi
        uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  smartfit-postgres-data:
