[project]
name = "smartfit-backend"
version = "0.1.0"
description = "SmartFit backend scaffold with FastAPI and Clean Architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "httpx>=0.28.0",
  "passlib[argon2]>=1.7.4",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-jose>=3.3.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "sqlalchemy>=2.0.36",
  "sqlmodel>=0.0.22",
  "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[tool.hatch.build.targets.sdist]
include = [
  "/app",
  "/src",
  "/alembic",
  "/alembic.ini",
  "/README.md",
  "/run-backend.sh",
  "/Dockerfile",
  "/.env.example",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
